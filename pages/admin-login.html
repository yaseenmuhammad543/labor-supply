<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login | Labor Supply</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
  </head>
  <body class="page-shell">
    <header class="site-header">
      <nav class="navbar navbar-expand-lg">
        <div class="container">
          <a class="navbar-brand d-flex align-items-center gap-2" href="../index.html">
            <span class="brand-mark"><i class="fa-solid fa-briefcase"></i></span>
            <span class="brand-text">Labor Supply</span>
          </a>
          <div class="nav-actions ms-auto d-flex align-items-center gap-2">
            <a class="btn btn-link btn-login" href="login.html">Worker Login</a>
            <a class="btn btn-primary" href="employer-login.html">Employer Login</a>
          </div>
        </div>
      </nav>
    </header>

    <main class="auth-shell">
      <div class="auth-card">
        <div class="auth-header">
          <span class="eyebrow">Administrator</span>
          <h1>Admin login</h1>
          <p>Manage users, jobs, qualifications, and platform compliance.</p>
        </div>

        <form>
          <div class="form-field">
            <label for="admin-email">Admin email</label>
            <input id="admin-email" name="email" type="email" placeholder="admin@laborsupply.com" required />
          </div>

          <div class="form-field">
            <label for="admin-password">Password</label>
            <div class="password-group">
              <input id="admin-password" name="password" type="password" placeholder="Enter admin password" required />
              <button type="button" class="password-toggle" data-target="admin-password">Show</button>
            </div>
          </div>

          <button type="submit" class="btn btn-primary w-100">ADMIN LOGIN</button>
        </form>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/main.js"></script>
  </body>
</html>
