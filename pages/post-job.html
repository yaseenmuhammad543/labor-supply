<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Post Job | Labor Supply</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
  </head>
  <body class="page-shell">
    <div class="dashboard-shell">
      <aside class="sidebar">
        <div class="sidebar-brand">
          <span class="brand-mark"><i class="fa-solid fa-briefcase"></i></span>
          <span>Labor Supply</span>
        </div>
        <nav class="sidebar-nav">
          <a href="employer-dashboard.html"><i class="fa-solid fa-gauge-high"></i> Dashboard</a>
          <a class="active" href="post-job.html"><i class="fa-solid fa-square-plus"></i> Post Job</a>
          <a href="#"><i class="fa-solid fa-briefcase"></i> My Jobs</a>
          <a href="#"><i class="fa-solid fa-users"></i> Applicants</a>
          <a href="#"><i class="fa-solid fa-star"></i> Shortlisted</a>
          <a href="#"><i class="fa-solid fa-bell"></i> Notifications</a>
          <a href="employer-profile.html"><i class="fa-solid fa-building"></i> Company Profile</a>
          <a href="../index.html"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
        </nav>
      </aside>

      <main class="dashboard-main">
        <div class="page-topbar">
          <div>
            <span class="eyebrow eyebrow-muted">Hiring request</span>
            <h1>Post a new job</h1>
          </div>
        </div>

        <section class="card-panel">
          <form class="form-grid" data-post-job-form>
            <div class="form-field">
              <label for="job-title">Job title</label>
              <input id="job-title" name="title" type="text" value="Electrician" required />
            </div>
            <div class="form-field">
              <label>Category</label>
              <select><option>Skilled Labor</option></select>
            </div>
            <div class="form-field full">
              <label for="job-description">Job description</label>
              <textarea id="job-description" name="description" required>We are hiring an experienced electrician for residential and commercial projects.</textarea>
            </div>
            <div class="form-field full">
              <label>Responsibilities</label>
              <textarea>Install wiring, conduct maintenance, troubleshoot faults, and ensure safety compliance.</textarea>
            </div>
            <div class="form-field">
              <label for="job-skills">Required skills</label>
              <input id="job-skills" name="skills" type="text" value="Electrical Wiring, Maintenance, Safety" />
            </div>
            <div class="form-field">
              <label for="job-qualification">Required qualification</label>
              <input id="job-qualification" name="qualification" type="text" value="ITI Electrical" />
            </div>
            <div class="form-field">
              <label for="job-experience">Required experience</label>
              <input id="job-experience" name="experience" type="text" value="2 years" />
            </div>
            <div class="form-field">
              <label>Minimum salary</label>
              <input id="minimum-salary" type="text" value="₹18,000" />
            </div>
            <div class="form-field">
              <label>Maximum salary</label>
              <input id="maximum-salary" type="text" value="₹25,000" />
            </div>
            <div class="form-field">
              <label>Salary type</label>
              <select><option>Monthly</option></select>
            </div>
            <div class="form-field">
              <label for="employment-type">Employment type</label>
              <select id="employment-type" name="employment_type"><option>Full Time</option><option>Part Time</option><option>Contract</option></select>
            </div>
            <div class="form-field">
              <label>Number of vacancies</label>
              <input type="number" value="5" />
            </div>
            <div class="form-field">
              <label for="job-location">Job location</label>
              <input id="job-location" name="location" type="text" value="Thiruvananthapuram" required />
            </div>
            <div class="form-field">
              <label>District</label>
              <select><option>Thiruvananthapuram</option></select>
            </div>
            <div class="form-field">
              <label>State</label>
              <select><option>Kerala</option></select>
            </div>
            <div class="form-field">
              <label>PIN code</label>
              <input type="text" value="695001" />
            </div>
            <div class="form-field">
              <label>Start date</label>
              <input type="date" />
            </div>
            <div class="form-field">
              <label>Application deadline</label>
              <input type="date" />
            </div>
            <div class="form-field full">
              <div class="action-group">
                <button class="btn btn-primary" type="submit">POST JOB</button>
                <button class="btn btn-outline-primary" type="button">SAVE DRAFT</button>
                <button class="btn btn-outline-primary" type="button">PREVIEW JOB</button>
              </div>
            </div>
          </form>
        </section>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/main.js"></script>
  </body>
</html>
