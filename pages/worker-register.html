<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Worker Registration | Labor Supply</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
  </head>
  <body class="page-shell">
    <header class="site-header">
      <nav class="navbar navbar-expand-lg">
        <div class="container">
          <a class="navbar-brand d-flex align-items-center gap-2" href="../index.html">
            <span class="brand-mark"><i class="fa-solid fa-briefcase"></i></span>
            <span class="brand-text">Labor Supply</span>
          </a>
          <div class="nav-actions ms-auto d-flex align-items-center gap-2">
            <a class="btn btn-link btn-login" href="login.html">Login</a>
            <a class="btn btn-primary" href="register.html">Back</a>
          </div>
        </div>
      </nav>
    </header>

    <main class="auth-shell">
      <div class="auth-card" style="max-width: 720px;">
        <div class="auth-header">
          <span class="eyebrow">Create worker profile</span>
          <h2>Join as a worker</h2>
          <p>Build your profile and start receiving role matches.</p>
        </div>

        <form>
          <div class="form-grid">
            <div class="form-field">
              <label for="fullname">Full Name</label>
              <input id="fullname" name="fullname" type="text" placeholder="Enter full name" />
            </div>
            <div class="form-field">
              <label for="wemail">Email</label>
              <input id="wemail" name="email" type="email" placeholder="you@example.com" />
            </div>
            <div class="form-field">
              <label for="phone">Phone</label>
              <input id="phone" name="phone" type="tel" placeholder="+91 98765 43210" />
            </div>
            <div class="form-field">
              <label for="wlocation">Location</label>
              <input id="wlocation" name="location" type="text" placeholder="Thiruvananthapuram" />
            </div>
            <div class="form-field">
              <label for="district">District</label>
              <select id="district" name="district">
                <option>Thiruvananthapuram</option>
                <option>Kollam</option>
                <option>Ernakulam</option>
                <option>Thrissur</option>
                <option>Malappuram</option>
              </select>
            </div>
            <div class="form-field">
              <label for="state">State</label>
              <select id="state" name="state">
                <option>Kerala</option>
                <option>Tamil Nadu</option>
                <option>Karnataka</option>
              </select>
            </div>
            <div class="form-field full">
              <label for="password">Password</label>
              <div class="password-group">
                <input id="password" name="password" type="password" placeholder="Create a password" />
                <button type="button" class="password-toggle" data-target="password">Show</button>
              </div>
            </div>
            <div class="form-field full">
              <label for="confirmpassword">Confirm Password</label>
              <div class="password-group">
                <input id="confirmpassword" name="confirm_password" type="password" placeholder="Confirm password" />
                <button type="button" class="password-toggle" data-target="confirmpassword">Show</button>
              </div>
            </div>
            <div class="form-field full">
              <label for="pincode">PIN Code</label>
              <input id="pincode" name="pincode" type="text" placeholder="695001" />
            </div>
          </div>

          <button type="submit" class="btn btn-primary w-100 mt-3">CREATE ACCOUNT</button>
        </form>

        <div class="auth-footer">
          <p>Already registered? <a href="login.html">Login</a></p>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/main.js"></script>
  </body>
</html>
