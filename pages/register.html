<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | Labor Supply</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
  </head>
  <body class="page-shell">
    <header class="site-header">
      <nav class="navbar navbar-expand-lg">
        <div class="container">
          <a class="navbar-brand d-flex align-items-center gap-2" href="../index.html">
            <span class="brand-mark"><i class="fa-solid fa-briefcase"></i></span>
            <span class="brand-text">Labor Supply</span>
          </a>
          <div class="nav-actions ms-auto d-flex align-items-center gap-2">
            <a class="btn btn-link btn-login" href="login.html">Login</a>
            <a class="btn btn-primary" href="worker-register.html">Join Now</a>
          </div>
        </div>
      </nav>
    </header>

    <main class="auth-shell">
      <div class="auth-card">
        <div class="auth-header">
          <span class="eyebrow">Choose your role</span>
          <h2>Create your account</h2>
          <p>Join as a worker, employer, or administrator.</p>
        </div>

        <div class="layout-2">
          <a href="worker-register.html" class="card-panel text-center text-dark">
            <div class="brand-mark mb-3 mx-auto"><i class="fa-solid fa-user"></i></div>
            <h3>Worker</h3>
            <p>Find jobs, upload qualifications, and build your profile.</p>
          </a>
          <a href="employer-register.html" class="card-panel text-center text-dark">
            <div class="brand-mark mb-3 mx-auto"><i class="fa-solid fa-building"></i></div>
            <h3>Employer</h3>
            <p>Post jobs, hire candidates, and manage applications.</p>
          </a>
        </div>

        <div class="auth-footer mt-4">
          <p>Already have an account? <a href="login.html">Login</a></p>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/main.js"></script>
  </body>
</html>
